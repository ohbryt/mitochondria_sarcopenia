# Pinned environment for HMSR sarcopenia multi-omic resource.
# Freeze after any package update:
#   conda env export --no-builds > environment.lock.yml
# Reproduce:
#   conda env create -f environment.yml
name: hmsr-sarcopenia
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.14.4
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.17.1
  - statsmodels=0.14.6
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - requests=2.32.5
  - pip
